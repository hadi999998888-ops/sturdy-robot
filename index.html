list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;background:#191a21;border:1px solid #30313b;border-radius:13px;padding:10px}.item img{width:90px;height:55px;object-fit:contain}.item .info{flex:1;min-width:0}.item strong{display:block}.item small{color:#999}.item b{white-space:nowrap}.empty{color:#92929a;text-align:center;padding:30px 10px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.drawer-actions{position:sticky;top:52px;z-index:2;background:#111217;padding:8px 0 12px;margin:0 0 8px}.drawer-actions .action{min-height:44px;box-shadow:0 5px 14px #0005}.spinning .skin-img{animation:roll .16s ease-in-out infinite alternate}.spinning .skin-stage{animation:stagePulse .45s ease-in-out infinite alternate}.spinning .skin-meta{animation:metaFlicker .18s linear infinite alternate}.spinning .raritybox{animation:pulse .38s ease-in-out infinite alternate}@keyframes roll{0%{transform:translateY(-16px) rotate(-2deg) scale(.88);opacity:.45;filter:blur(2px) drop-shadow(0 0 18px var(--rarity))}100%{transform:translateY(12px) rotate(2deg) scale(1.06);opacity:1;filter:blur(0) drop-shadow(0 0 22px var(--rarity))}}@keyframes stagePulse{to{transform:scale(1.025);background:radial-gradient(ellipse at center,color-mix(in srgb,var(--rarity),transparent 70%),transparent 72%)}}@keyframes metaFlicker{to{opacity:.45;transform:translateY(-3px)}}@keyframes pulse{to{filter:brightness(1.65);box-shadow:0 0 30px color-mix(in srgb,var(--rarity),transparent 65%)}}.skin-img.reveal{animation:reveal .72s cubic-bezier(.16,1,.3,1)}.skin-stage:after{content:"";position:absolute;inset:8% 0;pointer-events:none;background:linear-gradient(110deg,transparent 25%,#ffffff10 48%,#ffffff00 62%,transparent 75%);transform:translateX(-120%);opacity:0}.drop-flash .skin-stage:after{opacity:1;animation:sweep .7s ease-out}@keyframes sweep{to{transform:translateX(120%)}}@keyframes reveal{0%{transform:scale(.55) rotate(-8deg);opacity:0;filter:blur(8px)}65%{transform:scale(1.12) const rarityInfo={Common:{label:'Обычный',weight:52,color:'#a7a2bd',pips:1},Uncommon:{label:'Необычный',weight:27,color:'#91a9ad',pips:2},Rare:{label:'Редкий',weight:13,color:'#5c94ff',pips:3},Epic:{label:'Эпический',weight:6,color:'#b56bff',pips:4},Legendary:{label:'Легендарный',weight:1.7,color:'#e5b63f',pips:5},Arcana:{label:'Аркана',weight:.3,color:'#ff647b',pips:5}};

function save(){try{localStorage.setItem('so2drop_collection',JSON.stringify(collection));localStorage.setItem('so2drop_safe',JSON.stringify(safe));localStorage.setItem('so2drop_balance',String(balance));}catch(err){console.warn('Не удалось сохранить данные',err)} $('balance').textContent=balance.toLocaleString('ru-RU');const count=$('collectionCount');if(count)count.textContent=collection.length;}
function pick(){let r=Math.random()*100,sum=0;let rarity='Common';for(const [key,v] of Object.entries(rarityInfo)){sum+=v.weight;if(r<sum){rarity=key;break}}let pool=SKINS_DATABASE.filter(s=>s.rarity===rarity);if(!pool.length)pool=SKINS_DATABASE;return {...pool[Math.floor(Math.random()*pool.length)],id:Date.now()+Math.random(),rarity}}
function playDropSound(){const a=$('dropSound');if(!a)return;try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function display(s){current=s;const r=rarityInfo[s.rarity]||rarityInfo.Common;document.documentElement.style.setProperty('--rarity',r.color);document.documentElement.style.setProperty('--bg','#08090c');$('rarityName').textContent=r.label;$('price').textContent=Number(s.price).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';$('skinTitle').textContent=s.name;$('skinWeapon').textContent=s.weapon;$('skinImg').src=s.img;$('skinImg').classList.remove('placeholder');$('skinImg').classList.remove('reveal');void $('skinImg').offsetWidth;$('skinImg').classList.add('reveal');$('fallback').style.display='none';[...$('pips').children].forEach((p,i)=>p.classList.toggle('on',i<r.pips));$('hint').textContent='Нажми в любом месте, чтобы получить следующий скин';collection.unshift(s);save()}
function startSpin(e){if(e){e.preventDefault();} if(rolling)return; rolling=true; const area=$('tapArea'); area.classList.remove('spinning'); const img=$('skinImg'); img.classList.remove('reveal'); const next=pick(); playDropSound(); display(next); area.classList.add('drop-flash'); $('hint').textContent='Нажми в любом месте, чтобы получить следующий скин'; setTimeout(()=>area.classList.remove('drop-flash'),380); rolling=false;}

document.addEventListener('contextmenu',e=>{if(e.target.closest('#tapArea,button'))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(e.target.closest('#tapArea,button,.item'))e.preventDefault()});document.addEventListener('touchstart',e=>{if(e.target.closest('#tapArea,.item,button')){}},{passive:true});$('openMenu').onclick=()=>openDrawer('collection');$('closeMenu').onclick=()=> $('overlay').classList.remove('show');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderDrawer()});function openDrawer(t){tab=t;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('overlay').classList.add('show');renderDrawer()}
function renderDrawer(){const sourceArr=tab==='collection'?collection:safe;const rarityOrder={Arcana:6,Legendary:5,Epic:4,Rare:3,Uncommon:2,Common:1};const arr=[...sourceArr].sort((a,b)=>(rarityOrder[b.rarity]||0)-(rarityOrder[a.rarity]||0)||Number(b.price||0)-Number(a.price||0));$('drawerTitle').textContent=tab==='collection'?'Коллекция':'Сейф';$('drawerList').innerHTML=arr.length?arr.map((s,i)=>`<div class="item"><img src="${s.img}" alt=""><div class="info"><strong>${s.weapon} «${s.name}»</strong><small>${(rarityInfo[s.rarity]||rarityInfo.Common).label}</small></div><b>${Number(s.price).toLocaleString('ru-RU',{maximumFractionDigits:2})} ₽</b><button class="close" data-move="${s.id}">${tab==='collection'?'В сейф':'Вернуть'}</button><button class="close" data-sell="${s.id}">Продать</button></div>`).join(''):'<div class="empty">Пока пусто — получи первый скин!</div>';document.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{e.stopPropagation();const source=tab==='collection'?collection:safe;const target=tab==='collection'?safe:collection;const i=source.findIndex(s=>String(s.id)===b.dataset.move);if(i<0)return;target.unshift(source.splice(i,1)[0]);save();renderDrawer()});document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=e=>{e.stopPropagation();const arr=tab==='collection'?collection:safe;const i=arr.findIndex(s=>String(s.id)===b.dataset.sell);if(i<0)return;balance+=Number(arr[i].price||0);arr.splice(i,1);save();renderDrawer()});$('clearSafe').style.display=tab==='safe'?'block':'none';$('sellAll').textContent=tab==='collection'?'Продать всё':'Продать из сейфа'}
$('sellAll').onclick=()=>{let arr=tab==='collection'?collection:safe;balance+=arr.reduce((n,s)=>n+Number(s.price||0),0);arr.length=0;save();renderDrawer()};$('clearSafe').onclick=()=>{safe=[];save();renderDrawer()};save();
</script></body></html>
